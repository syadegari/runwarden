[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rmgr"
version = "0.3.0"
description = "A small, persistent resource queue for cooperating agents on Linux"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rmgr = "rmgr.cli:main"

[tool.setuptools]
packages = ["rmgr"]

[tool.setuptools.package-data]
rmgr = ["manual.md"]
